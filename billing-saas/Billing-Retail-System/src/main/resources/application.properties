spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update

jwt.secret.key=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

server.port=${PORT:8080}


# AWS S3 Configuration (if using)
aws.access.key=your_aws_access_key
aws.secret.key=your_aws_secret_key
aws.region=ap-south-1
aws.bucket.name=your_bucket_name

# Razorpay Configuration (if using)
razorpay.key.id=your_razorpay_key_id
razorpay.key.secret=your_razorpay_key_secret

APP_PUBLIC_BASE_URL=https://billing-software-2qab.onrender.com
APP_CORS_ALLOWED_ORIGINS=https://billing-saas-chi.vercel.app

#app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://billing.jaibalajirubber.com,https://billing-saas-chi.vercel.app,http://localhost:5173,https://www.billing.jaibalajirubber.com}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://billing.jaibalajirubber.com,https://www.billing.jaibalajirubber.com,https://billing-saas-chi.vercel.app,http://localhost:5173}
app.public.base-url=${APP_PUBLIC_BASE_URL:https://billing-software-2qab.onrender.com}
