# Copy settings into Render environment variables (or a local application.properties).
# Never commit real secrets.

spring.application.name=Billingsoftware

# --- Database (use Render PostgreSQL Internal URL as JDBC) ---
spring.datasource.url=jdbc:postgresql://HOST:5432/DATABASE
spring.datasource.username=USER
spring.datasource.password=PASSWORD

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

server.port=${PORT:8080}

jwt.secret.key=CHANGE_ME_MIN_32_CHARS_RANDOM
jwt.expiration=86400000

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Comma-separated: your Vercel URL(s), no trailing slash
app.cors.allowed-origins=https://your-app.vercel.app,http://localhost:5173

# Render Web Service URL (https://xxx.onrender.com) — for /uploads/... links in DB
app.public.base-url=https://your-api.onrender.com